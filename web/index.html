<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174d3c" />
    <title>RDX Solar Monitor</title>
    <script>
      // UX-01B: aplica el tema persistido antes del primer pintado para
      // evitar destellos. Misma resolución que useTheme.js ('light' por defecto).
      try {
        var rdxThemePreference = localStorage.getItem('rdx.theme');
        if (rdxThemePreference !== 'light' && rdxThemePreference !== 'dark' && rdxThemePreference !== 'auto') rdxThemePreference = 'light';
        if (rdxThemePreference === 'dark' || (rdxThemePreference === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
